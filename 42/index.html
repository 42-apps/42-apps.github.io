<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Hitchhiker's Guide to the Known Galaxy</title>
<meta name="description" content="A real, well-researched guide to the Milky Way — every star, world, nebula and black hole written in the deadpan voice of the Guide. Fly the 3D galaxy, then read the Guide. DON'T PANIC.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Crect width='256' height='256' rx='56' fill='%23050913'/%3E%3Cg fill='none' stroke='%2347f0a0' stroke-width='10' stroke-linecap='round'%3E%3Cpath d='M128 60 C180 70 196 128 196 128 C196 128 150 150 110 140'/%3E%3Cpath d='M128 196 C76 186 60 128 60 128 C60 128 106 106 146 116'/%3E%3C/g%3E%3Ccircle cx='128' cy='128' r='14' fill='%23ffe06b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css?v=1">
<script type="importmap">
{ "imports": { "three": "./lib/three.module.min.js", "three/addons/": "./lib/addons/" } }
</script>
</head>
<body>

  <!-- ===== 3D galaxy ===== -->
  <div id="scene" aria-hidden="true"></div>
  <div id="labels"></div>
  <div id="vignette" aria-hidden="true"></div>

  <!-- ===== Header ===== -->
  <header id="topbar">
    <div class="brand" id="brand" title="Home — DON'T PANIC" role="button" tabindex="0">
      <span class="brand-badge">DON'T<br>PANIC</span>
      <span class="brand-txt">
        <span class="brand-name">The Hitchhiker's Guide</span>
        <span class="brand-sub">to the Known Galaxy</span>
      </span>
    </div>

    <div id="modeToggle" role="tablist" aria-label="Guide mode">
      <button class="mode-pill on" data-mode="real" role="tab" aria-selected="true">🔭 Real Galaxy</button>
      <button class="mode-pill" data-mode="book" role="tab" aria-selected="false">📖 The Book</button>
    </div>

    <div class="tools">
      <div id="searchWrap">
        <input id="search" type="text" placeholder="Look something up…" autocomplete="off" spellcheck="false" aria-label="Search the Guide">
        <div id="searchResults" class="hidden" role="listbox"></div>
      </div>
      <button class="tbtn" id="btnBrowse" title="Browse by section" aria-label="Browse">☰</button>
      <button class="tbtn" id="btnRandom" title="Surprise me" aria-label="Random entry">🎲</button>
      <button class="tbtn" id="btnTour" title="Take the guided tour" aria-label="Guided tour">🎬</button>
      <button class="tbtn" id="btnShare" title="Copy a link to this view" aria-label="Share">🔗</button>
      <button class="tbtn" id="btnHelp" title="How it works / About" aria-label="Help">❔</button>
    </div>
  </header>

  <div id="modeBanner" class="hidden"></div>

  <!-- ===== Browse-by-category drawer ===== -->
  <div id="browse" class="panel hidden" role="menu" aria-label="Sections">
    <div class="browse-head">The Guide · Sections</div>
    <div id="browseList"></div>
  </div>

  <!-- ===== Map controls ===== -->
  <div id="mapctl">
    <button class="mbtn" data-view="home" title="Cinematic overview">🌌 Galaxy</button>
    <button class="mbtn" data-view="sol" title="Fly to the Sun &amp; the stellar neighbourhood">☀️ Sol</button>
    <button class="mbtn" data-view="core" title="Fly to the galactic centre">⚫ Core</button>
    <button class="mbtn" id="btnSpin" title="Toggle auto-rotate">⟳ Spin</button>
  </div>

  <!-- ===== Legend ===== -->
  <div id="legend"></div>

  <!-- ===== The Guide device ===== -->
  <aside id="guide" class="closed" aria-label="The Guide">
    <div class="device">
      <div class="device-top">
        <span class="device-brand">✦ THE GUIDE</span>
        <span class="device-dots"><i></i><i></i><i></i></span>
        <button id="guideClose" title="Close" aria-label="Close">✕</button>
      </div>
      <div class="screen" id="screen">
        <div class="scan"></div>
        <div id="screenBody"><!-- entry rendered here --></div>
      </div>
      <div class="device-bottom">
        <button class="navbtn" id="entryPrev" title="Previous in section">◂ Prev</button>
        <span class="device-tag" id="entryWhere">SUB-ETHA · ONLINE</span>
        <button class="navbtn" id="entryNext" title="Next in section">Next ▸</button>
      </div>
    </div>
  </aside>

  <!-- ===== Tour bar ===== -->
  <div id="tourbar" class="hidden">
    <button id="tourPrev" title="Previous stop">◂</button>
    <div class="tour-mid">
      <div class="tour-line" id="tourLine"></div>
      <div class="tour-meta"><span id="tourCount"></span> · <button id="tourEnd" class="linkbtn">end tour</button></div>
    </div>
    <button id="tourNext" title="Next stop">▸</button>
  </div>

  <!-- ===== Splash / home cover ===== -->
  <div id="splash">
    <div class="cover">
      <div class="cover-badge">DON'T<br>PANIC</div>
      <h1 class="cover-title">The Hitchhiker's Guide<br><span>to the Known Galaxy</span></h1>
      <p class="cover-tagline" id="coverTagline"></p>
      <p class="cover-intro" id="coverIntro"></p>
      <div class="cover-actions">
        <button id="btnBegin" class="cta">Open the Guide</button>
        <button id="btnTourStart" class="cta ghost">🎬 Take the tour</button>
      </div>
      <p class="cover-foot" id="coverHowto"></p>
    </div>
  </div>

  <!-- ===== Help / about ===== -->
  <div id="help" class="modal hidden">
    <div class="modal-card">
      <button class="modal-x" id="helpClose" aria-label="Close">✕</button>
      <h2>So long, and thanks for all the fish</h2>
      <div id="helpBody"></div>
    </div>
  </div>

  <div id="toast" class="hidden"></div>

  <script src="data/guide.js?v=1"></script>
  <script type="module" src="app.js?v=1"></script>
</body>
</html>
