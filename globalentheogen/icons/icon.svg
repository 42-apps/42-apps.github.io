<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#271858"/>
      <stop offset="100%" stop-color="#09061d"/>
    </radialGradient>
    <radialGradient id="sphere" cx="38%" cy="30%" r="74%">
      <stop offset="0%" stop-color="#6450b4"/>
      <stop offset="58%" stop-color="#2b1c5b"/>
      <stop offset="100%" stop-color="#130b2e"/>
    </radialGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2fd07a"/>
      <stop offset="27%" stop-color="#19b3a6"/>
      <stop offset="50%" stop-color="#f4c145"/>
      <stop offset="73%" stop-color="#ef8b3c"/>
      <stop offset="100%" stop-color="#ef4d52"/>
    </linearGradient>
    <clipPath id="globe"><circle cx="128" cy="128" r="74"/></clipPath>
  </defs>

  <rect x="18" y="18" width="220" height="220" rx="50" fill="url(#bg)"/>

  <!-- legal-status spectrum ring (green → red) -->
  <circle cx="128" cy="128" r="90" fill="none" stroke="url(#spectrum)" stroke-width="13" stroke-linecap="round" opacity="0.96"/>

  <!-- soft violet glow + sphere -->
  <circle cx="128" cy="128" r="76" fill="#a78bfa" opacity="0.20"/>
  <circle cx="128" cy="128" r="74" fill="url(#sphere)"/>

  <!-- graticule -->
  <g clip-path="url(#globe)" stroke="#b9a6ff" stroke-width="2.4" fill="none" opacity="0.55">
    <line x1="56" y1="100" x2="200" y2="100"/>
    <line x1="46" y1="128" x2="210" y2="128"/>
    <line x1="56" y1="156" x2="200" y2="156"/>
    <ellipse cx="128" cy="128" rx="30" ry="74"/>
    <ellipse cx="128" cy="128" rx="58" ry="74"/>
    <line x1="128" y1="54" x2="128" y2="202"/>
  </g>

  <!-- specular highlight -->
  <ellipse cx="104" cy="98" rx="20" ry="12" fill="#ffffff" opacity="0.16"/>
</svg>
